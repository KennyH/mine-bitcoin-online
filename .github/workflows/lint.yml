name: Lint and Terrascan

on:
  workflow_dispatch:
  push:
    branches: [ "main", "prod" ]
  pull_request:
    branches: [ "main", "prod" ]

jobs:
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Super Linter
        # Super-Linter modernized its repository. The docker:// syntax is outdated.
        uses: super-linter/super-linter/slim@v9.0.0 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JSX: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_PYTHON_FLAKE8: true
          YAML_LINTER_RULES_PATH: ./.github/linters/.yamllint.yaml

  terrascan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Terrascan via Docker
        # Bypasses the buggy tenable/terrascan-action wrapper and runs the 
        # official Docker container directly so skip-rules actually works!
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/iac" \
            -w "/iac" \
            tenable/terrascan:latest \
            scan -i terraform -t aws -d src/backend/terraform \
            --skip-rules="AC_AWS_0032,AC_AWS_0026,AC_AWS_0025"